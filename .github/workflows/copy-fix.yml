name: Demo Copy Fix

on:
  push:
    branches: [copy-fix]

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy-fix
      - name: Update public demo copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          replacements = {
              '<title>Roadmap Canary — Judge Demo</title>': '<title>Roadmap Canary</title>',
              '<h1>Regression testing for future features.</h1>': '<h1>Regression testing for future features</h1>',
              '<strong>Judge demo</strong>': '<strong>Recorded demo</strong>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit copy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refine public demo wording"
          git push origin HEAD:copy-fix
